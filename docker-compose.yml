# SeaweedFS (S3 gateway :8333) + ứng dụng. Chạy: docker compose up --build  ->  http://localhost:4000
services:
  seaweedfs:
    image: chrislusf/seaweedfs
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports: ["8333:8333"]
    volumes:
      - seaweed-data:/data
      - ./seaweed/s3.json:/etc/seaweedfs/s3.json:ro
  app:
    build: .
    depends_on: [seaweedfs]
    ports: ["4000:4000"]
    environment:
      NODE_ENV: production
      PORT: 4000
      SESSION_SECRET: ${SESSION_SECRET:-change-me}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      AUTH_DEV: ${AUTH_DEV:-}
      STORAGE_DRIVER: seaweedfs
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: gallery
      S3_ACCESS_KEY: gallery-dev-key
      S3_SECRET_KEY: gallery-dev-secret
      DB_PATH: /app/data/gallery.db
    volumes: ["app-data:/app/data"]
volumes: { seaweed-data: {}, app-data: {} }
