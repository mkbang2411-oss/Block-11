# SeaweedFS (S3 gateway :8333) + ứng dụng. Chạy: docker compose up --build  ->  http://localhost:4000
# Phân quyền: app chỉ có Read/Write/List bucket gallery; admin chỉ dùng một lần để tạo bucket (service bucket-init).
# Chỉ cổng S3 (8333) được mở ra máy chủ và chỉ ở 127.0.0.1; master/volume/filer nằm trong mạng nội bộ của compose.
services:
  seaweedfs:
    image: chrislusf/seaweedfs
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports: ["127.0.0.1:8333:8333"]
    volumes:
      - seaweed-data:/data
      - ./seaweed/s3.json:/etc/seaweedfs/s3.json:ro
  bucket-init:
    build: .
    depends_on: [seaweedfs]
    restart: "no"
    command: ["node", "scripts/create-bucket.mjs"]
    environment:
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: gallery
      ADMIN_ACCESS_KEY: admin-dev-key
      ADMIN_SECRET_KEY: admin-dev-secret
  app:
    build: .
    depends_on:
      seaweedfs: { condition: service_started }
      bucket-init: { condition: service_completed_successfully }
    ports: ["4000:4000"]
    environment:
      NODE_ENV: production
      PORT: 4000
      SESSION_SECRET: ${SESSION_SECRET:-change-me}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      AUTH_DEV: ${AUTH_DEV:-}
      STORAGE_DRIVER: seaweedfs
      S3_ENDPOINT: http://seaweedfs:8333
      S3_BUCKET: gallery
      S3_ACCESS_KEY: app-dev-key
      S3_SECRET_KEY: app-dev-secret
      DB_PATH: /app/data/gallery.db
    volumes: ["app-data:/app/data"]
volumes: { seaweed-data: {}, app-data: {} }
